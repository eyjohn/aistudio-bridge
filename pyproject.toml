[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aistudio-bridge"
version = "0.1.2"
description = "Bridge the gap between Google AI Studio and local workflows"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.13.5",
    "websockets",
    "PyYAML",
]

[project.scripts]
aistudio-bridge = "aistudio_bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aistudio_bridge"]
